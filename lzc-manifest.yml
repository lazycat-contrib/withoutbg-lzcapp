application:
  subdomain: withoutbg
  multi_instance: false
  upstreams:
    - location: /
      backend: http://withoutbg:8000/
services:
  withoutbg:
    # upstream: docker.io/withoutbg/withoutbg-openweights-v3-service-cpu:latest@sha256:2bb2f86ad1416b46233ef8dee37629813eb7031845d098878687eafe3a634f14
    image: docker.1ms.run/withoutbg/withoutbg-openweights-v3-service-cpu:latest@sha256:2bb2f86ad1416b46233ef8dee37629813eb7031845d098878687eafe3a634f14
usage: |
  Open the application URL to access the background-removal service and API. The CPU open-weights image is protected by LazyCat authentication. Upstream publishes only the mutable latest tag, so releases are driven by digest changes rather than tag versions.
